<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Toolkit</title>
  
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<style>
    
        body.dark-mode {
            background-color: #1a1a1a !important;
            color: #f4f4f9 !important;
        }

        body.dark-mode section,
        body.dark-mode #notes-list li {
            background-color: #2d2d2d !important;
            border-color: #444 !important;
            color: #f4f4f9 !important;
        }

        body.dark-mode section h2 {
            border-bottom-color: #444 !important;
        }

        body.dark-mode input[type="text"],
        body.dark-mode select,
        body.dark-mode #search-input {
            background-color: #333 !important;
            color: #fff !important;
            border-color: #555 !important;
        }
    </style>
</head>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Your simple toolkit for capturing thoughts and ideas.</p>
    </header>

    <main>
      
        <section>
            <h2>Add a note</h2>
            <form id="note-form">
                <label for="note-input">Your Note:</label>
                <input type="text" id="note-input" placeholder="Start typing your note here...">
                
                <label for="note-category">Category:</label>
                <select id="note-category">
                    <option value="Personal">Personal</option>
                    <option value="Work">Work</option>
                    <option value="Study">Study</option>
                </select>

                <button type="submit">Add Note</button>
            </form>
            
            <p id="error-message"></p>

            <p id="char-count">Characters: 0</p>
            <p id="word-count">Words: 0</p>
            <button type="button" id="clear-btn">Clear all Notes</button>
            <button type="button" id="theme-toggle">Toggle Theme</button>
        </section>
 
        <section>
            <h2>Your notes</h2>
            <label for="search-input">Search Notes:</label>
            <input type="text" id="search-input" placeholder="Search...">
            
            <p id="note-count">Total notes: 0</p>
            
            <ul id="notes-list"></ul>
        </section>

        <p><em>Open the Console to see the results.</em></p>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes App</p>
    </footer>
</body>
</html>
