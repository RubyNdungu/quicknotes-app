<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Toolkit</title>
  
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Your simple toolkit for capturing thoughts and ideas.</p>
    </header>

    <main>
        <section>
            <h2>Add a note</h2>
            
            <!-- API Assignment Required Elements -->
            <button id="load-btn">Load Notes</button>
            <p id="status"></p>

            <form id="note-form">
                <div class="input-group">
                    <label for="title-input">Title:</label>
                    <input type="text" id="title-input" placeholder="Note title..." maxlength="100" required>
                </div>
                
                <div class="input-group">
                    <label for="body-input">Body:</label>
                    <textarea id="body-input" rows="4" placeholder="Start typing your note here..."></textarea>
                </div>
                
                <div class="input-group">
                    <label for="note-category">Category:</label>
                    <select id="note-category">
                        <option value="Personal">Personal</option>
                        <option value="Work">Work</option>
                        <option value="Study">Study</option>
                    </select>
                </div>

                <button type="submit" id="submit-btn">Add Note</button>
            </form>
            
            <!-- Extra Custom Features -->
            <p id="char-count">Characters: 0</p>
            <p id="word-count">Words: 0</p>
            
            <div style="margin-top: 15px;">
                <button type="button" id="clear-btn">Clear all Notes</button>
                <button type="button" id="theme-toggle">Toggle Theme</button>
            </div>
        </section>
 
        <section>
            <h2>Your notes</h2>
            <div class="input-group">
                <label for="search-input">Search Notes:</label>
                <input type="text" id="search-input" placeholder="Search...">
            </div>
            
            <p id="note-count">Total notes: 0</p>
            
            <!-- Empty ul list for the API to populate -->
            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes App</p>
    </footer>
</body>
</html>
