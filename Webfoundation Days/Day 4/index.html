<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Toolkit</title>
  
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>

        <label for="note-text">Your Note:</label>
        <br>
        <textarea id="note-text" rows="8" cols="40" placeholder="Start typing your note here..."></textarea>
        
        <p id="char-count">Characters: 0</p>
        <p id="word-count">Words: 0</p>
        
        <button id="clear-btn">Clear Note</button>
        <button id="theme-toggle">Toggle Theme</button>

        <p><em>Open the Console to see the results.</em></p>
    </main>
</body>
</html>
